<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бронирование номера — Сладкие сны</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">Сладкие сны</a>
      <p class="slogan">Бронируйте сны мечты</p>
      <nav class="nav"><a href="catalog.html">Каталог</a></nav>
    </div>
  </header>

  <main class="container">
    <h1>Бронирование номера</h1>
    <p id="roomInfo" class="room-info"></p>

    <form id="bookingForm" class="booking-form" novalidate>
      <div class="form-group">
        <label for="firstName">Имя *</label>
        <input type="text" id="firstName" name="firstName" required>
        <small class="error" data-error-for="firstName"></small>
      </div>

      <div class="form-group">
        <label for="lastName">Фамилия *</label>
        <input type="text" id="lastName" name="lastName" required>
        <small class="error" data-error-for="lastName"></small>
      </div>

      <div class="form-group">
        <label for="phone">Телефон *</label>
        <input type="tel" id="phone" name="phone" placeholder="+7(XXX)XXX-XX-XX" required>
        <small class="error" data-error-for="phone"></small>
      </div>

      <div class="form-group">
        <label for="email">E-mail *</label>
        <input type="email" id="email" name="email" required>
        <small class="error" data-error-for="email"></small>
      </div>

      <div class="form-group">
        <label for="checkIn">Дата заезда * (ДД.ММ.ГГГГ)</label>
        <input type="text" id="checkIn" name="checkIn" placeholder="ДД.ММ.ГГГГ" required>
        <small class="error" data-error-for="checkIn"></small>
      </div>

      <div class="form-group">
        <label for="checkOut">Дата выезда * (ДД.ММ.ГГГГ)</label>
        <input type="text" id="checkOut" name="checkOut" placeholder="ДД.ММ.ГГГГ" required>
        <small class="error" data-error-for="checkOut"></small>
      </div>

      <button type="submit" class="btn btn--primary">Отправить заявку</button>
    </form>

    <div id="successMessage" class="success" hidden>
      Заявка успешно отправлена! Мы свяжемся с вами для уточнения данных.
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div><strong>Адрес:</strong> г. Москва, ул. Сонная, д. 12</div>
      <div><strong>Режим работы:</strong> круглосуточно</div>
      <div><strong>Телефон:</strong> <a href="tel:+74951234567">+7 (495) 123-45-67</a></div>
      <div><strong>E-mail:</strong> <a href="mailto:info@sweetdreams.ru">info@sweetdreams.ru</a></div>
    </div>
  </footer>

  <script src="js/validation.js"></script>
</body>
</html>
